services:
  java-ai-integration-platform:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY before starting}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
      SERVER_PORT: 8080
